<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Copy Doctor</title>
<style>
  :root {
    --accent: #6d5efc;
    --accent-soft: #eceafe;
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #171726;
    --muted: #6b6b80;
    --line: #e7e7f0;
    --good: #16b364;
    --warn: #f59e0b;
    --bad: #ef4444;
    --shadow: 0 10px 30px rgba(30, 20, 80, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    display: grid; place-items: center; color: #fff; font-size: 22px;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); margin: 2px 0 26px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px; box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 20px; }

  label.field-label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 12px; font-size: 15px;
    font-family: inherit; color: var(--ink); background: #fbfbfe;
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); border-color: transparent; }

  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 11px; padding: 12px 22px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: transform .08s ease, opacity .2s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); }

  .muted { color: var(--muted); }
  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.5);
    border-top-color: #fff; border-radius: 50%; display: inline-block;
    animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #results { margin-top: 24px; display: none; }
  #results.show { display: block; animation: fadeUp .4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Score block */
  .score-card { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .gauge { position: relative; width: 132px; height: 132px; flex: none; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .track { stroke: var(--line); }
  .gauge .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.22,1,.36,1), stroke 1s; }
  .gauge .num {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 40px; font-weight: 800; letter-spacing: -0.03em;
  }
  .score-meta { flex: 1; min-width: 220px; }
  .score-meta h2 { margin: 0 0 6px; font-size: 18px; }

  .history { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
    padding: 5px 12px; border-radius: 999px; font-size: 14px;
    animation: pop .35s ease;
  }
  .chip.latest { background: var(--accent); color: #fff; }
  .arrow { color: var(--muted); font-size: 13px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Breakdown bars */
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; margin-top: 4px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .bar-track { height: 9px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; border-radius: 999px; transition: width 1s cubic-bezier(.22,1,.36,1); }

  .missing { margin-top: 20px; }
  .missing h3 { font-size: 14px; margin: 0 0 8px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { background: #fff4e6; color: #b45309; border: 1px solid #fde3bf; padding: 4px 11px; border-radius: 8px; font-size: 13px; }

  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 12px; }
  .rewrite-text { white-space: pre-wrap; font-size: 15.5px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); background: #fbfbfe; color: var(--muted);
    padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .variant-body { white-space: pre-wrap; font-size: 15px; min-height: 60px; }

  .feedback-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .feedback-row input { flex: 1; min-width: 240px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; font-size: 15px; font-family: inherit; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .quick button { background: #fff; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .quick button:hover { border-color: var(--accent); color: var(--accent); }

  .error { color: var(--bad); font-weight: 600; margin-top: 10px; }
  .copy-btn { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; float: right; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">🩺</div>
    <div>
      <h1>Copy Doctor</h1>
    </div>
  </header>
  <p class="tagline">Paste your marketing or listing copy. Get a diagnosis, a rewrite, and three ready-to-send variants.</p>

  <div class="card">
    <label class="field-label" for="copy">Your copy</label>
    <textarea id="copy" spellcheck="false"></textarea>
    <div class="row" style="margin-top:14px;">
      <button id="diagnoseBtn" class="btn btn-primary">Diagnose</button>
      <span id="status" class="muted"></span>
    </div>
    <div id="topError" class="error"></div>
  </div>

  <div id="results">
    <!-- Score -->
    <div class="card score-card">
      <div class="gauge">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle class="track" cx="66" cy="66" r="58" fill="none" stroke-width="12"/>
          <circle id="gaugeFill" class="fill" cx="66" cy="66" r="58" fill="none" stroke-width="12"
                  stroke-dasharray="364.4" stroke-dashoffset="364.4"/>
        </svg>
        <div id="scoreNum" class="num">0</div>
      </div>
      <div class="score-meta">
        <h2>Overall copy score</h2>
        <div class="muted" id="scoreVerdict">—</div>
        <div class="history" id="history"></div>
      </div>
    </div>

    <!-- Breakdown -->
    <div class="card">
      <p class="section-title">Diagnosis</p>
      <div class="bars">
        <div>
          <div class="bar-label"><span>Clarity</span><span id="clarityVal">0</span></div>
          <div class="bar-track"><div class="bar-fill" id="clarityBar"></div></div>
        </div>
        <div>
          <div class="bar-label"><span>Urgency</span><span id="urgencyVal">0</span></div>
          <div class="bar-track"><div class="bar-fill" id="urgencyBar"></div></div>
        </div>
        <div>
          <div class="bar-label"><span>Emotional pull</span><span id="emotionVal">0</span></div>
          <div class="bar-track"><div class="bar-fill" id="emotionBar"></div></div>
        </div>
      </div>
      <div class="missing">
        <h3>Missing / weak info</h3>
        <div class="tags" id="missingTags"></div>
      </div>
    </div>

    <!-- Rewrite -->
    <div class="card">
      <button class="copy-btn" data-copy="rewriteText">Copy</button>
      <p class="section-title">Polished rewrite</p>
      <div class="rewrite-text" id="rewriteText"></div>
    </div>

    <!-- Variants -->
    <div class="card">
      <p class="section-title">Variants</p>
      <div class="tabs" id="variantTabs">
        <button class="tab active" data-v="social_caption">Social caption</button>
        <button class="tab" data-v="formal">Formal</button>
        <button class="tab" data-v="whatsapp">WhatsApp</button>
      </div>
      <button class="copy-btn" data-copy="variantBody">Copy</button>
      <div class="variant-body" id="variantBody"></div>
    </div>

    <!-- Feedback / regenerate -->
    <div class="card">
      <p class="section-title">Refine it</p>
      <div class="feedback-row">
        <input id="feedback" placeholder="e.g. make it punchier, add urgency, shorten it" />
        <button id="regenBtn" class="btn btn-ghost">Regenerate</button>
      </div>
      <div class="quick" id="quick">
        <button>make it punchier</button>
        <button>add urgency</button>
        <button>shorten it</button>
        <button>more luxurious tone</button>
        <button>add a clear call to action</button>
      </div>
      <div id="regenError" class="error"></div>
    </div>
  </div>
</div>

<script>
const SEED = `2 bed flat for rent in downtown. good location near shops and transport. has parking and a balcony. recently painted. available now. rent is negotiable. call for more info.`;

const CIRC = 2 * Math.PI * 58; // gauge circumference
let state = { copy: '', rewrite: '', variants: {}, activeVariant: 'social_caption', scores: [] };

const $ = (id) => document.getElementById(id);
$('copy').value = SEED;

function colorFor(v) {
  if (v >= 75) return getComputedStyle(document.documentElement).getPropertyValue('--good');
  if (v >= 50) return getComputedStyle(document.documentElement).getPropertyValue('--warn');
  return getComputedStyle(document.documentElement).getPropertyValue('--bad');
}

function animateScore(target) {
  const el = $('scoreNum');
  const start = parseInt(el.textContent, 10) || 0;
  const fill = $('gaugeFill');
  fill.style.strokeDashoffset = CIRC * (1 - target / 100);
  fill.style.stroke = colorFor(target);
  const dur = 900, t0 = performance.now();
  function step(now) {
    const p = Math.min((now - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(start + (target - start) * eased);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  $('scoreVerdict').textContent =
    target >= 85 ? 'Excellent — ready to publish.' :
    target >= 70 ? 'Solid, with room to sharpen.' :
    target >= 50 ? 'Needs work to convert.' : 'Weak — big upside from a rewrite.';
}

function setBar(barId, valId, v) {
  const bar = $(barId);
  bar.style.width = v + '%';
  bar.style.background = colorFor(v);
  $(valId).textContent = v;
}

function renderHistory() {
  const h = $('history');
  h.innerHTML = '';
  state.scores.forEach((s, i) => {
    if (i > 0) { const a = document.createElement('span'); a.className = 'arrow'; a.textContent = '→'; h.appendChild(a); }
    const c = document.createElement('span');
    c.className = 'chip' + (i === state.scores.length - 1 ? ' latest' : '');
    c.textContent = s;
    h.appendChild(c);
  });
}

function renderVariant() {
  $('variantBody').textContent = state.variants[state.activeVariant] || '';
}

function render(data) {
  state.rewrite = data.rewrite || '';
  state.variants = data.variants || {};
  state.scores.push(data.score);
  renderHistory();
  animateScore(data.score);
  const b = data.breakdown || {};
  setBar('clarityBar', 'clarityVal', b.clarity ?? 0);
  setBar('urgencyBar', 'urgencyVal', b.urgency ?? 0);
  setBar('emotionBar', 'emotionVal', b.emotional_pull ?? 0);
  const tags = $('missingTags');
  tags.innerHTML = '';
  (b.missing_info || []).forEach((m) => {
    const t = document.createElement('span'); t.className = 'tag'; t.textContent = m; tags.appendChild(t);
  });
  $('rewriteText').textContent = state.rewrite;
  renderVariant();
  $('results').classList.add('show');
}

async function call(payload, btn, errEl) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Diagnosing…';
  errEl.textContent = '';
  try {
    const r = await fetch('/api/diagnose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Request failed');
    render(data);
    if (payload.currentRewrite !== undefined) $('feedback').value = '';
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

$('diagnoseBtn').addEventListener('click', () => {
  const copy = $('copy').value.trim();
  if (!copy) { $('topError').textContent = 'Paste some copy first.'; return; }
  state.copy = copy;
  state.scores = [];
  call({ copy }, $('diagnoseBtn'), $('topError'));
});

$('regenBtn').addEventListener('click', () => {
  const feedback = $('feedback').value.trim() || 'make it stronger';
  call({ copy: state.copy, currentRewrite: state.rewrite, feedback }, $('regenBtn'), $('regenError'));
});

$('variantTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
  btn.classList.add('active');
  state.activeVariant = btn.dataset.v;
  renderVariant();
});

$('quick').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') { $('feedback').value = e.target.textContent; $('regenBtn').click(); }
});

document.querySelectorAll('.copy-btn').forEach((b) => {
  b.addEventListener('click', () => {
    const text = $(b.dataset.copy).textContent;
    navigator.clipboard.writeText(text).then(() => {
      const o = b.textContent; b.textContent = 'Copied!'; setTimeout(() => (b.textContent = o), 1200);
    });
  });
});
</script>
</body>
</html>
